# iOS 工程由 XcodeGen 从这份 YAML 生成；仓库里不提交 .xcodeproj（手拼 pbxproj 太脆）
# CI 见 .github/workflows/ios.yml
name: PocketVault
options:
  bundleIdPrefix: com.qoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketVault:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.pocketvault.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 口袋文件库
        UILaunchScreen: {}
        # 刻意不申请任何相册权限：导入只走文档选择器，且永不写入系统相册
        UISupportsDocumentBrowser: NO
  PocketVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PocketVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketVault:
    build:
      targets:
        PocketVault: all
    test:
      targets:
        - PocketVaultTests
      gatherCoverageData: false
