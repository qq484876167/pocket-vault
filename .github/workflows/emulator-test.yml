name: emulator-test

# 目的：在没有实机的情况下，用 GitHub 托管 Linux runner 的 KVM 起 Android 模拟器，
# 跑 app/src/androidTest 里的仪器化测试（这些验收项必须在真实 Android 运行时上才成立）。
# 只在显式派发或推送到这条 CI 分支时运行，不影响 main。

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 模拟器 API 级别
        required: false
        default: "34"
  push:
    branches: [ci/emulator-tests]

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 上一次失败的原因就在这儿：runner 上 /dev/kvm 是 crw-rw---- root kvm，
      # 而 runner 用户不在 kvm 组里，模拟器动作检测到没加速就退回 -accel off（TCG），
      # x86_64 镜像软渲染 600 秒起不来。这里把设备节点放开。
      - name: Enable KVM access
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          egrep -c '(vmx|svm)' /proc/cpuinfo || true
          free -m
          df -h

      # 用 runner 自带的 Gradle 分发（services.gradle.org），绕开本机改过的腾讯云 wrapper 地址
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache gradle wrappers
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper

      - name: Emulator instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ github.event.inputs.api-level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 6144
          boot-timeout: 1200
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      # 把结果摘要直接打进日志，省得每次再去下载 artifact
      - name: Summarize
        if: always()
        run: |
          find app/build/outputs/androidTest-results -name "*.xml" -print -exec cat {} \; || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
